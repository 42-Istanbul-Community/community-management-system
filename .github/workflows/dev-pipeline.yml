name: Dev CI/CD Pipeline

on:
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  dev-build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment Files and Directories
        run: |
          find . -type f -name ".env*.example" -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;
          
          if [ -d "./secrets" ]; then
            find ./secrets -type f -name "*.example" -exec sh -c 'cp "$1" "${1%.example}.txt"' _ {} \;
          fi

          mkdir -p ./data
          
          if [ -f ".env" ]; then
            if grep -q "^DATA_DIR=" .env; then
              sed -i "s|^DATA_DIR=.*|DATA_DIR=$(pwd)/data|" .env
            else
              echo "DATA_DIR=$(pwd)/data" >> .env
            fi
          fi

          echo "Environment layout setup completed."

      - name: Build Images
        run: make build

      - name: Start Services
        run: make up

      - name: Wait and Verify Containers
        run: |
          echo "Waiting for containers to initialize..."
          
          MAX_RETRIES=20
          COUNT=0

          TOTAL_SERVICES=$(docker compose config --services | wc -l | tr -d ' ')

          until [ $COUNT -ge $MAX_RETRIES ]; do
            UNHEALTHY=$(docker ps -a --format '{{.Status}}' | grep -iE 'unhealthy' || true)
            RUNNING_COUNT=$(docker compose ps --status running -q | wc -l | tr -d ' ')

            if [ -n "$UNHEALTHY" ]; then
              echo "Error: Found unhealthy or exited container!"
              break
            fi

            if [ "$RUNNING_COUNT" -eq "$TOTAL_SERVICES" ] && [ "$TOTAL_SERVICES" -gt 0 ]; then
              echo "All $TOTAL_SERVICES containers are up and running successfully!"
              break
            fi

            echo "Containers starting... ($RUNNING_COUNT/$TOTAL_SERVICES running) Waiting 5s ($((COUNT+1))/$MAX_RETRIES)"
            COUNT=$((COUNT+1))
            sleep 5
          done

          if [ $COUNT -eq $MAX_RETRIES ] || [ -n "$(docker ps -a --format '{{.Status}}' | grep -iE 'unhealthy|exited' || true)" ]; then
            echo "Error: Container check failed or timed out."
            exit 1
          fi

      - name: Save Container Logs to File
        if: always()
        run: |
          mkdir -p logs
          docker compose logs --no-color > logs/container-output.log 2>&1
          docker ps -a > logs/container-status.log

      - name: Upload Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-container-logs
          path: logs/
          retention-days: 7
