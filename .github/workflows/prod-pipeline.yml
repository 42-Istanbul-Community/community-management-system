name: Prod CI/CD Pipeline

on:
  push:
    branches: [ prod ]

jobs:
  prod-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment Files and Directories
        run: |
          find . -type f -name ".env*.example" -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;

          if [ -d "./secrets" ]; then
            find ./secrets -type f -name "*.example" -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;
          fi

          mkdir -p ./data

          if [ -f ".env" ]; then
            if grep -q "^DATA_DIR=" .env; then
              sed -i "s|^DATA_DIR=.*|DATA_DIR=$(pwd)/data|" .env
            else
              echo "DATA_DIR=$(pwd)/data" >> .env
            fi
          fi

          echo "Environment layout setup completed."

      - name: Build Images
        run: make build

      - name: Start Services
        run: make up

      - name: Wait for Services
        run: |
          echo "Waiting for services to initialize..."

          MAX_RETRIES=40
          COUNT=0

          TOTAL_SERVICES=$(docker compose config --services | wc -l | tr -d ' ')

          until [ $COUNT -ge $MAX_RETRIES ]; do
            RUNNING_COUNT=$(docker compose ps --status running -q | wc -l | tr -d ' ')
            FAILED=$(docker compose ps -a --format '{{.Status}}' | grep -iE 'exited|unhealthy' || true)

            if [ -n "$FAILED" ]; then
              echo "Error: A service exited or became unhealthy."
              docker compose ps
              exit 1
            fi

            if [ "$RUNNING_COUNT" -eq "$TOTAL_SERVICES" ] && [ "$TOTAL_SERVICES" -gt 0 ]; then
              echo "All $TOTAL_SERVICES containers are running."
              break
            fi

            echo "Services starting... ($RUNNING_COUNT/$TOTAL_SERVICES)"
            COUNT=$((COUNT+1))
            sleep 5
          done

          if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
            echo "Error: Services failed to start within timeout."
            docker compose ps
            exit 1
          fi

      - name: Wait for Services
        run: |
          echo "Waiting 5 minutes for all services to initialize..."
          sleep 300

      - name: Run Bootstrap Tests
        run: |
          cd tests
          npm test

      - name: Save Container Logs
        if: always()
        run: |
          mkdir -p logs

          docker compose logs --no-color > logs/container-output.log 2>&1
          docker compose ps -a > logs/container-status.log

      - name: Upload Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-container-logs
          path: logs/
          retention-days: 7