services:
  auth:
    image: auth
    container_name: auth
    build: ../../services/auth
    restart: always
    networks:
      - backend
      - auth-db
    secrets:
      - auth_db_password
      - auth_jwt_secret
    env_file:
      - ../../services/auth/.env
      - ../../services/auth/.env.jwt
    environment:
      JWT_SECRET_KEY: /run/secrets/auth_jwt_secret
      DB_PASSWORD_FILE: /run/secrets/auth_db_password
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      OPS_DOMAIN_NAME: ${OPS_DOMAIN_NAME}
    depends_on:
      postgres-auth:
        condition: service_healthy
  content:
    image: content
    container_name: content
    build: ../../services/content
    restart: always
    networks:
      - backend
      - content-db
    secrets:
      - content_db_password
      - minio_content_access_key
      - minio_content_secret_key
    env_file:
      - ../../services/content/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DB_PASSWORD_FILE: /run/secrets/content_db_password
    depends_on:
      postgres-content:
        condition: service_healthy
  membership:
    image: membership
    container_name: membership
    build: ../../services/membership
    restart: always
    networks:
      - backend
      - membership-db
    secrets:
      - membership_db_password
    env_file:
      - ../../services/membership/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DB_PASSWORD_FILE: /run/secrets/membership_db_password
    depends_on:
      postgres-membership:
        condition: service_healthy
  community:
    image: community
    container_name: community
    build: ../../services/community
    restart: always
    networks:
      - backend
      - community-db
    secrets:
      - community_db_password
      - minio_community_access_key
      - minio_community_secret_key
    env_file:
      - ../../services/community/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DB_PASSWORD_FILE: /run/secrets/community_db_password
    depends_on:
      postgres-community:
        condition: service_healthy
  id:
    image: id
    container_name: id
    build: ../../services/id
    restart: always
    networks:
      - backend
      - id-db
    secrets:
      - id_db_password
      - minio_id_access_key
      - minio_id_secret_key
    env_file:
      - ../../services/id/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      DB_PASSWORD_FILE: /run/secrets/id_db_password
    depends_on:
      postgres-id:
        condition: service_healthy
  middleware:
    image: middleware
    container_name: middleware
    build: ../../services/middleware
    restart: always
    networks:
      - backend
    secrets:
      - auth_jwt_secret
    env_file:
      - ../../services/auth/.env.jwt
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      JWT_SECRET_KEY: /run/secrets/auth_jwt_secret
  orchestration:
    image: orchestration
    container_name: orchestration
    build: ../../services/orchestration
    restart: always
    networks:
      - backend
    env_file:
      - ../../services/orchestration/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
  asset:
    image: asset
    container_name: asset
    build: ../../services/asset
    restart: always
    networks:
      - backend
    secrets:
      - minio_id_access_key
      - minio_id_secret_key
      - minio_community_access_key
      - minio_community_secret_key
      - minio_content_access_key
      - minio_content_secret_key
    env_file:
      - ../../services/asset/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
  bootstrap:
    image: bootstrap
    container_name: bootstrap
    build: ../../services/bootstrap
    restart: "no"
    networks:
      - backend
    secrets:
      - bootstrap_admin_password
    env_file:
      - ../../services/bootstrap/.env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
    depends_on:
      postgres-id:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      id:
        condition: service_started
      auth:
        condition: service_started
  adminer:
    image: adminer
    container_name: adminer
    build: ../../services/adminer
    restart: always
    networks:
      - auth-db
      - content-db
      - membership-db
      - community-db
      - id-db
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-content:
        condition: service_healthy
      postgres-membership:
        condition: service_healthy
      postgres-community:
        condition: service_healthy
      postgres-id:
        condition: service_healthy

secrets:
  auth_db_password:
    file: ../../secrets/auth_db_password.txt
  auth_jwt_secret:
    file: ../../secrets/auth_jwt_secret.txt
  log_db_password:
    file: ../../secrets/log_db_password.txt
  notification_db_password:
    file: ../../secrets/notification_db_password.txt
  content_db_password:
    file: ../../secrets/content_db_password.txt
  membership_db_password:
    file: ../../secrets/membership_db_password.txt
  community_db_password:
    file: ../../secrets/community_db_password.txt
  id_db_password:
    file: ../../secrets/id_db_password.txt
  bootstrap_admin_password:
    file: ../../secrets/bootstrap_admin_password.txt