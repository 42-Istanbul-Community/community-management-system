services:
  prometheus:
    profiles:
      - ops
    image: prometheus
    container_name: prometheus
    build: ../../infrastructure/monitoring/prometheus
    networks:
      - monitoring
    restart: always
    volumes:
      - prometheus-data:/prometheus
  grafana:
    profiles:
      - ops
    image: grafana
    container_name: grafana
    build: ../../infrastructure/monitoring/grafana
    networks:
      - monitoring
    restart: always
    env_file:
      - ../../infrastructure/monitoring/grafana/.env
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    secrets:
      - grafana_password
    volumes:
      - grafana-data:/var/lib/grafana
  cadvisor:
    profiles:
      - ops
    image: cadvisor
    container_name: cadvisor
    build: ../../infrastructure/monitoring/cadvisor
    networks:
      - monitoring
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
  node-exporter:
    profiles:
      - ops
    image: node-exporter
    container_name: node-exporter
    build: ../../infrastructure/monitoring/node-exporter
    networks:
      - monitoring
    restart: always
    volumes:
      - /:/host:ro
  alertmanager:
    profiles:
      - ops
    image: alertmanager
    container_name: alertmanager
    build: ../../infrastructure/monitoring/alertmanager
    networks:
      - monitoring
    restart: always
    secrets:
      - slack_webhook_url
    environment:
      OPS_DOMAIN_NAME: ${OPS_DOMAIN_NAME}

secrets:
  grafana_password:
    file: ../../secrets/grafana_password.txt
  slack_webhook_url:
    file: ../../secrets/slack_webhook_url.txt