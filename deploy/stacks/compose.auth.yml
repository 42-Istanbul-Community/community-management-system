services:
  auth:
    image: auth
    container_name: auth
    build: ../../services/auth
    restart: always
    networks:
      - backend
      - auth-db
    secrets:
      - auth_db_password
    environment:
      DB_NAME: ${POSTGRES_AUTH_DB}
      DB_USER: ${POSTGRES_AUTH_USER}
      DB_PASSWORD_FILE: /run/secrets/auth_db_password
