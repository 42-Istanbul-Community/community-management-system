services:
  elasticsearch:
    profiles:
      - ops
    image: elasticsearch
    container_name: elasticsearch
    build: ../../infrastructure/logging/elasticsearch
    restart: always
    networks:
      - logging
    environment:
      ELASTIC_PASSWORD_FILE: /run/secrets/elasticsearch_password
    secrets:
      - elasticsearch_password
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
  elasticsearch-setup:
    profiles:
      - ops
    image: elasticsearch-setup
    container_name: elasticsearch-setup
    build: ../../infrastructure/logging/elasticsearch-setup
    restart: "no"
    networks:
      - logging
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/elasticsearch_password
      KIBANA_PASSWORD_FILE: /run/secrets/kibana_password
      LOGSTASH_PASSWORD_FILE: /run/secrets/logstash_password
    secrets:
      - elasticsearch_password
      - kibana_password
      - logstash_password
    depends_on:
      elasticsearch:
        condition: service_healthy
  logstash:
    profiles:
      - ops
    image: logstash
    container_name: logstash
    build: ../../infrastructure/logging/logstash
    restart: always
    networks:
      - logging
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: logstash_writer
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/logstash_password
    secrets:
      - logstash_password
    depends_on:
      elasticsearch-setup:
       condition: service_completed_successfully
  kibana:
    profiles:
      - ops
    image: kibana
    container_name: kibana
    build: ../../infrastructure/logging/kibana
    restart: always
    networks:
      - logging
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD_FILE: /run/secrets/kibana_password
    secrets:
      - kibana_password
    depends_on:
      elasticsearch-setup:
       condition: service_completed_successfully

secrets:
  elasticsearch_password:
    file: ../../secrets/elasticsearch_password.txt
  kibana_password:
    file: ../../secrets/kibana_password.txt
  logstash_password:
    file: ../../secrets/logstash_password.txt