services:
  gateway:
    image: gateway
    container_name: gateway
    build: ../../infrastructure/gateway
    restart: always
    networks:
      - frontend
      - backend
      - monitoring
      - logging
    ports:
      - '8443:443'
      - '8880:80'
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      API_DOMAIN_NAME: ${API_DOMAIN_NAME}
      OPS_DOMAIN_NAME: ${OPS_DOMAIN_NAME}
    depends_on:
      frontend:
        condition: service_started
      auth:
        condition: service_healthy
      id:
        condition: service_healthy
      content:
        condition: service_started
      membership:
        condition: service_healthy
      community:
        condition: service_healthy
      rustfs:
        condition: service_started
      adminer:
        condition: service_started
        required: false
      kibana:
        condition: service_started
        required: false
      grafana:
        condition: service_started
        required: false