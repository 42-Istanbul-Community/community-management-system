services:
  postgres-auth:
    image: postgres-auth
    container_name: postgres-auth
    build: ../../infrastructure/databases/postgres-auth
    restart: always
    networks:
      - auth-db
    secrets:
      - auth_db_password
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_password

secrets:
  auth_db_password:
    file: ../../secrets/auth_db_password.txt