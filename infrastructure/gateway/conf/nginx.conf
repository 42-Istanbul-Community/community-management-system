events {}

http
{
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server
    {
        listen 80;
        server_name localhost api.localhost ops.localhost;

            return 301 https://$host$request_uri;
    }

    server
    {
        listen 443 ssl;
        server_name localhost;

        include /etc/nginx/ssl.conf;

        location /
        {
            include /etc/nginx/proxy.conf;
            proxy_pass http://frontend:8000/;
        }
    }

    server
    {
        listen 443 ssl;
        server_name api.localhost;

        include /etc/nginx/ssl.conf;

        error_page 404 /404.html;

        location /auth/register
        {
            return 404;
        }

        location /id/createUser
        {
            return 404;
        }

        location / {
            include /etc/nginx/proxy.conf;
            proxy_pass http://middleware:8080;
        }
        
        location /404.html
        {
            root /usr/share/nginx/html;
            internal;
        }
    }

    server
    {
        listen 443 ssl;
        server_name ops.localhost;
    
        resolver 127.0.0.11 valid=10s ipv6=off;

        include /etc/nginx/ssl.conf;
    
        location /monitor
        {
            include /etc/nginx/proxy.conf;
            set $grafana_upstream grafana:3000;
            proxy_pass http://$grafana_upstream;
        }
    
        location /logs
        {
            include /etc/nginx/proxy.conf;
            set $kibana_upstream kibana:5601;
            proxy_pass http://$kibana_upstream;
        }
    
        location /alerts
        {
            return 200 'AlertManager Service';
            add_header Content-Type text/plain;
        }

        location /
        {
            return 404;
        }
        
        location /404.html
        {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
